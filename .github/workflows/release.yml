# Push a tag like v1.2.3 to:
#   - attach Pi binaries to a GitHub Release (scripts/install-frame.sh downloads them)
#   - publish the multi-arch server image to Docker Hub
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  frame:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          LDFLAGS: -s -w -X photoframe/internal/version.Version=${{ github.ref_name }}
        run: |
          mkdir dist
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "$LDFLAGS" -o dist/photoframe-linux-armv7 ./cmd/frame
          GOOS=linux GOARCH=arm64       go build -trimpath -ldflags "$LDFLAGS" -o dist/photoframe-linux-arm64 ./cmd/frame
          sed 's#YOUR_GITHUB_USER/PhotoFrame#${{ github.repository }}#' scripts/install-frame.sh > dist/install-frame.sh
          cd dist && sha256sum photoframe-linux-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/photoframe-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
